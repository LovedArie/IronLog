# CI — build and test IronLog on every push to main and every pull request.
#
# Three jobs, from fastest to most realistic:
#   core       Linux, NO Qt. Proves the domain core stays Qt-free (arc42 Q7).
#   linux-qt   Linux, Qt 6.4 from apt — the OLDEST Qt we claim to support.
#   windows    Windows, Qt 6.8 LTS MinGW — the owner's compiler family
#              (MinGW 13.1, same as Qt 6.11's).
# Two Qt versions on purpose: together they cover the range CMakeLists.txt
# promises (find_package(Qt6 6.4 ...)).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core only (Linux, no Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure (app OFF — no Qt on this machine)
        run: cmake -S . -B build -DIRONLOG_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  linux-qt:
    name: Full build (Linux, Qt 6.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # No display on a CI machine: Qt GUI programs must use the offscreen
      # platform plugin (TickTimer lesson: encode it in CI, not in memory).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-base-dev-tools libgl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
      - name: Smoke test — launch the real app and screenshot it
        run: |
          ./build/IronLog --data "$RUNNER_TEMP/smoke.json" --demo --tab progress \
                          --screenshot "$RUNNER_TEMP/smoke.png"
          test -s "$RUNNER_TEMP/smoke.png"   # file exists and isn't empty
      - name: Keep the screenshot
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-linux
          path: ${{ runner.temp }}/smoke.png

  windows:
    name: Full build (Windows, Qt 6.8 MinGW)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Qt's MinGW build AND Qt's own MinGW 13.1 compiler. The runner's
      # preinstalled MinGW is a newer GCC with a different ABI; mixing them
      # crashes at runtime (same trap as TROUBLESHOOTING "wrong compiler").
      # Pinned to 6.8.3 (LTS): the installer behind this action (aqtinstall)
      # could not locate Qt 6.11.3's package data on 2026-11-23 — see
      # docs/TROUBLESHOOTING.md. Linux CI covers 6.4, the owner builds 6.11
      # locally, so 6.4 / 6.8 / 6.11 are all exercised.
      - name: Install Qt 6.8 LTS + MinGW 13.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true

      - name: Put Qt's MinGW first on PATH
        run: |
          MINGW="$(cygpath -u "$IQTA_TOOLS")/mingw1310_64/bin"
          echo "$(cygpath -w "$MINGW")" >> "$GITHUB_PATH"
      - name: Prove which compiler we got
        run: g++ --version

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel

      # Evidence, not theory: list every libstdc++-6.dll each shell would
      # find. Git Bash puts Git's own mingw64\bin early on PATH, and its
      # libstdc++ is from a different GCC than Qt's MinGW 13.1.
      - name: Which C++ runtime DLLs are visible?
        run: |
          echo "--- Git Bash sees:"; which -a libstdc++-6.dll || true
      - name: Which C++ runtime DLLs are visible? (PowerShell)
        shell: pwsh
        run: |
          Write-Output "--- PowerShell sees:"
          where.exe libstdc++-6.dll

      # Tests run from PowerShell, NOT Git Bash: PowerShell's PATH starts
      # with Qt's MinGW bin (from GITHUB_PATH), so every test .exe loads the
      # runtime it was built with. Under Git Bash the first test hung: a
      # Windows "entry point not found" popup that no one can click.
      # --timeout: a hang now fails in 2 minutes instead of 25.
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure --timeout 120
